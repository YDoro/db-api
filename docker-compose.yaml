version: '3'

services:
  db-api:
    container_name: do-nothing-api
    build: .
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongo
    env_file: 
      - .env
    environment:
      - DB_CONNECTION_STING=mongodb://mongo:27017/

  mongo:
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data: